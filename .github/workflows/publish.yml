name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Publishes only when the dispatched commit changed package.json's version.
      # workflow_dispatch has no github.event.before, so compare with the parent commit.
      - name: Check version change
        id: version
        run: |
          OLD_VERSION=$(git show HEAD~1:package.json | jq -r '.version' 2>/dev/null || echo "")
          NEW_VERSION=$(jq -r '.version' package.json)
          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$OLD_VERSION" != "$NEW_VERSION" ] && [ -n "$OLD_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Node comes from package.json devEngines.runtime, vite-plus from the pnpm catalog.
      - uses: voidzero-dev/setup-vp@v1.21.2
        if: steps.version.outputs.changed == 'true'
        with:
          run-install: false

      - run: vp install --frozen-lockfile
        if: steps.version.outputs.changed == 'true'

      - run: vp check
        if: steps.version.outputs.changed == 'true'

      - run: vp test
        if: steps.version.outputs.changed == 'true'

      # Build before publishing: the package ships dist only.
      - run: vp pack
        if: steps.version.outputs.changed == 'true'

      # devEngines pins pnpm, so `npm publish` refuses to run (EBADDEVENGINES);
      # `vp pm publish` forwards to pnpm publish. The auth .npmrc sits in the
      # runner's temp folder, outside the checkout, so the tree stays clean and
      # pnpm's git checks (clean tree, publish branch) still run. It holds a
      # reference to NPM_TOKEN, not its value; NPM_CONFIG_USERCONFIG points pnpm at it.
      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: |
          echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          vp pm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        run: |
          gh release create "v${{ steps.version.outputs.new }}" \
            --title "v${{ steps.version.outputs.new }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
