name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node comes from package.json devEngines.runtime, vite-plus from the pnpm catalog.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          run-install: false
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test
      - run: vp pack
